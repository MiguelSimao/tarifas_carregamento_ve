time_restrictions_definitions:

  # =========================================================================
  # Ciclo Diário - Bi-horário (2H)
  # 70 horas de vazio por semana (10h/dia todos os dias)
  # =========================================================================
  - country_code: PT
    start_date: "2026-01-01"
    cycle: diario
    schedule: "2H"
    periods:
      vazio:
        - start_time: "22:00"
          end_time: "08:00"
          days_of_week: [1, 2, 3, 4, 5, 6, 7]
      fora_vazio:
        - start_time: "08:00"
          end_time: "22:00"
          days_of_week: [1, 2, 3, 4, 5, 6, 7]

  # =========================================================================
  # Ciclo Semanal - Bi-horário (2H)
  # 76 horas de vazio por semana (35h dias úteis + 17h sábado + 24h domingo)
  # =========================================================================
  - country_code: PT
    start_date: "2026-01-01"
    cycle: semanal
    schedule: "2H"
    periods:
      vazio:
        # Dias úteis (Segunda a Sexta): 00h às 07h
        - start_time: "00:00"
          end_time: "07:00"
          days_of_week: [1, 2, 3, 4, 5]
        # Sábado: 00h às 09h, 14h às 20h, 22h às 24h
        - start_time: "00:00"
          end_time: "09:00"
          days_of_week: [6]
        - start_time: "14:00"
          end_time: "20:00"
          days_of_week: [6]
        - start_time: "22:00"
          end_time: "24:00"
          days_of_week: [6]
        # Domingo: Todo o dia (00h às 24h)
        - start_time: "00:00"
          end_time: "24:00"
          days_of_week: [7]

      fora_vazio:
        # Dias úteis (Segunda a Sexta): 07h às 24h
        - start_time: "07:00"
          end_time: "24:00"
          days_of_week: [1, 2, 3, 4, 5]
        # Sábado: 09h às 14h, 20h às 22h
        - start_time: "09:00"
          end_time: "14:00"
          days_of_week: [6]
        - start_time: "20:00"
          end_time: "22:00"
          days_of_week: [6]
        # Domingo: Sem fora de vazio

  # =========================================================================
  # Ciclo Diário - Tri-horário (3H) - Inverno
  # =========================================================================
