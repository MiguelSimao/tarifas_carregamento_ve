    start_date: "2026-01-01"
    cycle: diario
    schedule: "3H"
    season: inverno
    periods:
      vazio:
        - start_time: "22:00"
          end_time: "08:00"
          days_of_week: [1, 2, 3, 4, 5, 6, 7]
      ponta:
        - start_time: "09:00"
          end_time: "10:30"
          days_of_week: [1, 2, 3, 4, 5, 6, 7]
        - start_time: "18:00"
          end_time: "20:30"
          days_of_week: [1, 2, 3, 4, 5, 6, 7]
      cheias:
        - start_time: "08:00"
          end_time: "09:00"
          days_of_week: [1, 2, 3, 4, 5, 6, 7]
        - start_time: "10:30"
