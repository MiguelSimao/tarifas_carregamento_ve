[project]
name = "tarifas-carregamento-ve"
version = "0.1.0"
description = "Especificações e dataset open-source de tarifas de carregamento de veículos elétricos (EV)"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT AND CC-BY-4.0" }
dependencies = [
    "pydantic>=2.0.0",
    "pyyaml>=6.0",
]

[dependency-groups]
dev = [
    "pytest>=8.0.0",
    "ruff>=0.1.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/tariffs"]

[project.scripts]
tariffs-validate = "tariffs.validate:main"
tariffs-compile = "tariffs.compile:main"
tariffs-generate-schema = "tariffs.generate_schema:main"
