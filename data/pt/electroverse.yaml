_flat_fee: &_flat_fee
  unit: flat
  price: 0.3

_ac_tiers: &_ac_tiers
  type: AC
  tiers:
  - max: 8
    price: 0.41
  - min: 8
    max: 23
    price: 0.42
  - min: 23
    price: 0.60

_dc_tiers: &_dc_tiers
  type: DC
  tiers:
  - max: 51
    price: 0.60
  - min: 51
    max: 151
    price: 0.72
  - min: 151
    price: 0.79

providers:
- name: Electroverse
  app_url:
  app_id:
    android: energy.octopus.electricjuice

  plans:
  - name: Base
    country_code: PT
    networks:
    - network_id: MOBIE
      excluded_cpos:
      - IONY
      - GLPP
      - ATLA
      - EMEL
      tariffs:
      - *_flat_fee
      - *_ac_tiers
      - *_dc_tiers

    - network_id: MOBIE
      included_cpos:
      - GLPP
      tariffs:
      - *_flat_fee
      - *_ac_tiers
      - *_dc_tiers
      - type: AC
        unit: time
        tiers:
        - min: 8
          max: 23
          price: 0.05
        - min: 23
          price: 0.08

    - network_id: MOBIE
      included_cpos:
      - IONY
      tariffs:
      - type: DC
        price: 0.3
        unit: flat
      - type: DC
        price: 0.62

  - name: Ionity Subscription
    country_code: PT
    cost: 12.0
    months: 1
    networks:
    - network_id: MOBIE
      included_cpos:
      - IONY
      tariffs:
      - type: DC
        price: 0.3
        unit: flat
      - type: DC
        price: 0.37

  - name: Powerdot Subscription
    country_code: PT
    cost: 2.0
    months: 1
    networks:
    - network_id: HORZ
      tariffs:
      - unit: flat
        price: 0.3
      - type: AC
        price: 0.3
      - type: DC
        tiers:
        - max: 51
          price: 0.44
        - min: 51
          max: 151
          price: 0.51
        - min: 151
